name: Daily Bread Tagalog

on:
  schedule:
    # Naka-set ito sa 6:00 AM Philippine Time (22:00 UTC ng nakaraang araw)
    - cron: '0 22 * * *'
  workflow_dispatch: # Para magawa nating i-run manually pindot lang ng button

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Daily Bread Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
